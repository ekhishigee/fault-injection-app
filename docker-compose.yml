# Local laptop. Same dashboard API as the systemd install.
#   docker compose up --build
# Dashboard: http://localhost:8080/?token=local-demo
# Target:    http://localhost/health
#
# On small EC2 instances use ./deploy/install.sh instead of Compose.

name: demo-target

services:
  target:
    container_name: demo-target
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: python -m app.target
    restart: unless-stopped
    environment:
      DEMO_STATE_PATH: /var/lib/demo-faults/state.json
      DEMO_DB_PATH: /var/lib/demo-faults/events.db
      DEMO_TARGET_HOST: 0.0.0.0
      DEMO_TARGET_PORT: "8081"
    volumes:
      - ${DEMO_STATE_HOST_PATH:-./data/state}:/var/lib/demo-faults
    expose:
      - "8081"
    networks:
      - demo

  controller:
    container_name: demo-controller
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: python -m app.controller
    restart: unless-stopped
    depends_on:
      - target
    ports:
      - "${DEMO_CONTROLLER_PORT:-8080}:8080"
    environment:
      DEMO_RUNTIME: compose
      DEMO_FAULT_CTL: /opt/demo-target/deploy/bin/demo-fault-ctl
      DEMO_STATE_PATH: /var/lib/demo-faults/state.json
      DEMO_DB_PATH: /var/lib/demo-faults/events.db
      DEMO_DISK_MOUNT: /mnt/demo-disk
      DEMO_DISK_FILL_CAP_BYTES: "${DEMO_DISK_FILL_CAP_BYTES:-33554432}"
      DEMO_CONTROLLER_HOST: 0.0.0.0
      DEMO_CONTROLLER_PORT: "8080"
      DEMO_CONTROLLER_TOKEN: "${DEMO_CONTROLLER_TOKEN:-local-demo}"
      DEMO_TARGET_CONTAINER: demo-target
      DEMO_NGINX_CONTAINER: demo-nginx
      DEMO_DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - ${DEMO_STATE_HOST_PATH:-./data/state}:/var/lib/demo-faults
      - ${DEMO_DISK_HOST_PATH:-./data/demo-disk}:/mnt/demo-disk
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - demo

  nginx:
    container_name: demo-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - target
    ports:
      - "${DEMO_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - demo

networks:
  demo:
    name: demo-target
